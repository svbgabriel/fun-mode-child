services:
  mongo:
    container_name: fmc-db
    image: mongo:8.2
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: fun-mode-child
    volumes:
      - db_data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "28017:27017"

volumes:
  db_data:
